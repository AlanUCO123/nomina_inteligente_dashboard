{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 60px auto; text-align: center; padding: 40px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;">
    <h1 style="color: #dc2626; margin-bottom: 16px;">Error de acceso</h1>
    <p style="font-size: 16px; color: #7f1d1d; line-height: 1.6;">
        {{ mensaje }}
    </p>
    <p style="margin-top: 24px; font-size: 14px; color: #991b1b;">
        Si tiene preguntas, contacte al administrador del sistema.
    </p>
    <a href="/home" style="display: inline-block; margin-top: 24px; padding: 10px 20px; background: #dc2626; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">
        Volver al inicio
    </a>
</div>
{% endblock %}
